<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><title>Contexa Connector</title><link rel="stylesheet" href="options.css" /></head><body><main><p class="eyebrow">CONTEXA CONNECTOR</p><h1>Chrome privacy controls</h1><p>Only page title, domain, and optional search terms are sent. Incognito tabs and page content are never captured.</p><label>Contexa API address<input id="apiBase" type="url" /></label><label>Connector token<input id="sessionToken" type="password" placeholder="Paste the device token from Contexa Settings" /></label><label class="toggle"><input id="enabled" type="checkbox" /> Enable browser metadata collection</label><button id="save">Save settings</button><p id="status" role="status"></p></main><script src="options.js"></script></body></html>
